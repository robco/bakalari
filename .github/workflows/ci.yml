name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this workflow before it publishes, and publishes the "dist" artifact built here.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The live tests need a real Bakaláři account; CI runs the offline suite only.
  BAKALARI_SKIP_LIVE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Pinned: setup-python has Python 3.9 builds for ubuntu-24.04 but not for ubuntu-26.04.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the offline test suite
        run: python -m unittest discover -v

  mcp:
    name: MCP SDK interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the reference client (test dependency only)
        run: python -m pip install "mcp>=1.26,<2" jsonschema
      - name: Exercise the stdio server through the official client
        run: python -m unittest tests.test_mcp_sdk -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install coverage
        run: python -m pip install coverage
      - name: Run the offline test suite under coverage
        run: python -m coverage run -m unittest discover
      - name: Check the coverage (at least 90 %)
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --fail-under=90
      - name: Write the HTML report
        if: ${{ !cancelled() }}
        run: python -m coverage html
      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: ruff check --output-format=github .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install mypy
        # mypy 2 no longer accepts python_version = "3.9" (pyproject.toml); lift the pin when 3.9 support ends.
        run: python -m pip install "mypy<2"
      - name: Run mypy
        run: mypy bakalari

  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build and twine
        run: python -m pip install build twine
      - name: Build the sdist and the wheel
        run: python -m build
      - name: Check the package metadata
        run: python -m twine check --strict dist/*
      - name: Check the distribution contents
        shell: python
        run: |
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          wheels, sdists = sorted(Path("dist").glob("*.whl")), sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              print(f"::error::Expected one wheel and one sdist in dist/, found {[p.name for p in wheels + sdists]}")
              sys.exit(1)
          with zipfile.ZipFile(wheels[0]) as wheel:
              wheel_files = wheel.namelist()
          with tarfile.open(sdists[0]) as sdist:
              sdist_files = [name.partition("/")[2] for name in sdist.getnames()]

          problems = []
          if "bakalari/py.typed" not in wheel_files:
              problems.append("the wheel has no bakalari/py.typed")
          if any(name.startswith("tests/") for name in wheel_files):
              problems.append("the wheel contains tests/")
          if not any(name.endswith(".dist-info/licenses/LICENSE") for name in wheel_files):
              problems.append("the wheel has no LICENSE")
          for required in ("LICENSE", "CHANGELOG.md", "bakalari/py.typed", "tests/support.py"):
              if required not in sdist_files:
                  problems.append(f"the sdist has no {required}")
          if any(name.startswith((".github/", ".claude/")) for name in sdist_files):
              problems.append("the sdist contains .github/ or .claude/")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"{wheels[0].name}: {len(wheel_files)} files; {sdists[0].name}: {len(sdist_files)} entries")
      - name: Install the wheel into a fresh virtual environment and run it
        run: |
          version="$(python -c 'import runpy; print(runpy.run_path("bakalari/_version.py")["__version__"])')"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"  # away from the source tree, so only the installed package can be imported
          output="$("$RUNNER_TEMP/venv/bin/bakalari" --version)"
          echo "$output"
          if [ "$output" != "bakalari $version" ]; then
            echo "::error::'bakalari --version' printed '$output', expected 'bakalari $version'"
            exit 1
          fi
          "$RUNNER_TEMP/venv/bin/python" -m bakalari --help > /dev/null
          "$RUNNER_TEMP/venv/bin/bakalari-mcp" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/python" -m bakalari mcp < /dev/null
      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
