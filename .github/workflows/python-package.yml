name: Python Package CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      check-release:
        description: Validate the release tag and changelog before building
        type: boolean
        default: false

permissions:
  contents: read

# Include the caller's workflow name so publishing cannot cancel ordinary CI.
concurrency:
  group: python-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  BAKALARI_SKIP_LIVE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  compatibility:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.13", "3.14"]
        include:
          # Python 3.9 builds are available on ubuntu-24.04.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests with only the standard library
        run: python -m unittest discover -s unittests -t . -v

  test-and-build:
    name: Test & Build (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate the release
        if: ${{ inputs.check-release }}
        run: python .github/scripts/check_release.py
      - name: Install development and integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp-test]"
      - name: Lint and check types
        run: |
          python -m ruff check --output-format=github .
          python -m mypy bakalari
      - name: Run offline tests and MCP interoperability with coverage
        run: |
          python -m pytest unittests tests \
            --cov=bakalari --cov-config=pyproject.toml --cov-fail-under=90 \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --junitxml=reports/test-results.xml \
            --html=reports/test-report.html --self-contained-html
      - name: Generate test and coverage summaries
        if: ${{ !cancelled() }}
        run: |
          python .github/scripts/parse_test_results.py
          python .github/scripts/parse_coverage.py
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python .github/scripts/check_distribution.py
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports-python-3.12
          path: reports/
          retention-days: 30
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 30
