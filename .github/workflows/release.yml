name: Release

on:
  push:
    tags: ["v*"]
  # A manual run is a rehearsal: the same checks, but it publishes to TestPyPI instead of PyPI.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the version and extract the release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the tag matches bakalari/_version.py
        id: version
        run: |
          version="$(python -c 'import runpy; print(runpy.run_path("bakalari/_version.py")["__version__"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match bakalari/_version.py: expected v$version."
            exit 1
          fi
          echo "bakalari $version ($GITHUB_REF_TYPE $GITHUB_REF_NAME)"
      - name: Extract the release notes from CHANGELOG.md
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["VERSION"]
          notes, inside = [], False
          for line in Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines():
              if line.startswith("## ["):
                  if inside:
                      break
                  inside = line.startswith(f"## [{version}]")
              elif inside and re.match(r"\[[^\]]+\]: ", line):  # the link references at the bottom
                  break
              elif inside:
                  notes.append(line)
          text = "\n".join(notes).strip()
          if not text:
              # A tag push must not publish without notes; a rehearsal only warns.
              level = "error" if os.environ["GITHUB_EVENT_NAME"] == "push" else "warning"
              print(f"::{level}::CHANGELOG.md has no '## [{version}]' section with release notes.")
              if level == "error":
                  sys.exit(1)
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(text + "\n", encoding="utf-8")
          print(text)
      - name: Upload the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  ci:
    name: CI
    # The offline tests on every supported Python, coverage, ruff, mypy, and the build with its checks.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/bakalari/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Download the distribution built by CI
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub Release
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes/
      - name: Create the release with the changelog section and the distribution files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          flags=()
          if printf '%s' "$VERSION" | grep -Eq '(a|b|rc|\.dev)[0-9]*$'; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "bakalari $VERSION" \
            --notes-file notes/release-notes.md "${flags[@]}"

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/bakalari/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Download the distribution built by CI
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
