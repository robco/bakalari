name: Bug report
description: The library or the bakalari command does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > **Issues are public. Never paste passwords, access or refresh tokens, session files, web login links
        > or personal data of students** (names, marks, absences, messages, ids). Replace every such value with
        > `<redacted>` or an invented one before you submit.

        Security problems belong in a [private report](https://github.com/robco/bakalari/security/advisories/new), not in an issue.
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The output of `bakalari --version` or `python -m pip show bakalari`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: The output of `python --version`.
      placeholder: "3.13.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11, ..."
    validations:
      required: true
  - type: input
    id: api-version
    attributes:
      label: Bakaláři API version
      description: The output of `bakalari version` (it needs no login). You may leave out the school address.
      placeholder: "Bakaláři REST API 3.52.1 (application 2.2.1009.7)"
  - type: dropdown
    id: account-type
    attributes:
      label: Account type
      description: The kind of Bakaláři account you use with the client.
      options:
        - Parent
        - Student
        - Teacher
        - No login (public endpoints only)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or a minimal Python snippet, without credentials.
      placeholder: |
        1. bakalari marks --json
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output
      description: >-
        The traceback, or the output of the command run with `-v`, with every secret and personal value replaced.
        It is shown as code, so no backticks are needed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, tokens, session files, web login links and personal data of students from this report.
          required: true
